[package]
name = "bud-decision-studio"
version = "0.1.3"
description = "Bud Decision Studio: run open decision models on your own computer"
authors = ["Bud Ecosystem"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
